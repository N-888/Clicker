{% extends 'base.html' %}
<!-- Используем базовый шаблон base.html -->

{% block content %}
<!-- Начинаем основной блок контента страницы -->

<div class="container mt-5">
    <!-- Создаем контейнер Bootstrap с отступом сверху -->

    <div class="row justify-content-center">
        <!-- Создаем строку сетки Bootstrap и центрируем ее содержимое -->

        <div class="col-md-8 col-lg-6">
            <!-- Создаем колонку: на средних экранах 8/12, на больших 6/12 -->

            <div class="card shadow-lg border-0">
                <!-- Создаем карточку с большой тенью и без границ -->

                <div class="card-header bg-primary text-white text-center py-4">
                    <!-- Верхняя часть карточки: синий фон, белый текст, центрирование, большие отступы -->
                    <h1 class="display-5 fw-bold mb-0">
                        <!-- Большой жирный заголовок без отступа снизу -->
                        Привет!
                        <!-- Текст приветствия -->
                    </h1>
                </div>

                <div class="card-body text-center py-5">
                    <!-- Основная часть карточки: центрированный текст, большие вертикальные отступы -->

                    <h3 class="text-muted mb-4">
                        <!-- Подзаголовок серого цвета с отступом снизу -->
                        Количество кликов
                        <!-- Текст подзаголовка -->
                    </h3>

                    <div class="display-3 text-primary fw-bold mb-5">
                        <!-- Очень крупный текст синего цвета жирным начертанием -->
                        {{ current_user.clicks }}
                        <!-- Вывод количества кликов текущего пользователя -->
                    </div>

                    <a href="{{ url_for('click') }}"
                       class="btn btn-success btn-lg px-5 py-3 fw-bold">
                        <!-- Большая зеленая кнопка с жирным текстом и дополнительными отступами -->
                        Кнопка
                        <!-- Текст на кнопке -->
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
<!-- Конец блока контента -->
